name: Importar amostras sonoras revisao BET
on:
  push:
    branches:
      - feature/som-alef-bet-icone-20261124
    paths:
      - .github/workflows/import-audios-alef-bet.yml
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar audios com fonte e licenca documentadas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl -A 'BET Hebrew Education audio attribution contact via GitHub' -fLS --retry 2 --connect-timeout 10 --max-time 45 \
          'https://upload.wikimedia.org/wikipedia/commons/4/4d/Glottal_stop.ogg' \
          -o assets/audio/alef-parada-glotal-peter-isotalo.ogg
          curl -A 'BET Hebrew Education audio attribution contact via GitHub' -fLS --retry 2 --connect-timeout 10 --max-time 45 \
          'https://upload.wikimedia.org/wikipedia/commons/c/c3/He-%D7%91%D6%B5%D6%BC%D7%99%D7%AA.ogg' \
          -o assets/audio/bet-voz-humana-ijon.ogg
          python3 - <<'PYTHON'
          from pathlib import Path
          for name in ['alef-parada-glotal-peter-isotalo.ogg','bet-voz-humana-ijon.ogg']:
              file=Path('assets/audio')/name
              if file.stat().st_size<2000:raise ValueError('Arquivo muito pequeno: '+str(file))
              if file.open('rb').read(4)!=b'OggS':raise ValueError('Arquivo nao e Ogg: '+str(file))
              print(name,file.stat().st_size)
          PYTHON
      - name: Armazenar no proprio BET
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/alef-parada-glotal-peter-isotalo.ogg assets/audio/bet-voz-humana-ijon.ogg
          git commit -m "Guardar amostras humanas Alef [ʔ] e Bet com fontes documentadas"
          git push origin HEAD:feature/som-alef-bet-icone-20261124
